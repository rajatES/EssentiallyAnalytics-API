services:
  postgres-db:
    image: postgres:15-alpine
    container_name: social_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: social_studio_db
    # No host port published — the backend reaches Postgres over the internal
    # Docker network (postgres-db:5432), avoiding host port conflicts.
    # To inspect from host: docker compose exec postgres-db psql -U postgres -d social_studio_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    container_name: social_redis
    restart: unless-stopped
    # No host port published — the backend reaches Redis over the internal
    # Docker network (redis-cache:6379), so we avoid host port conflicts.
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: DockerFile
    container_name: social_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    volumes:
      - ./gcp-key.json:/app/gcp-key.json:ro
    environment:
      - PORT=5000
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:3000
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_NAME=social_studio_db
      - DB_SYNC=true
      - REDIS_HOST=redis-cache
      - BIGQUERY_PROJECT_ID=${BIGQUERY_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json
      - MSN_SHEET_ID=1O6lZT1DntkqWtOWUtmMA7BCSmm9FjwSkA-qk5afg-vc
      - MSN_TAB_NAME=Sheet1
      - MSN_MODERATION_SHEET_ID=1QrFg0eg6eNYMtLMrRHHrM8bJyEq_I7F02Lbk3iCpLHM
      - MSN_MODERATION_TAB_NAME=Sheet1
      - MSN_INGEST_KEY=${MSN_INGEST_KEY:-dev-msn-ingest-key-change-me}
      - SETUP_SECRET=${SETUP_SECRET}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
